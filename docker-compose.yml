services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: news_consumer_ingester
    restart: unless-stopped
    environment:
      - PYTHONPATH=src
      - VAULT_ADDR=http://vault-server:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_SECRET_PATH=secret/DB_SERVICES
    networks:
      - vault-network
      - services_network
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/status | grep -q 'State:.*running\\|State:.*sleeping' || exit 1" ]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ../logs:/app/logs
networks:
  vault-network:
    external: true
  services_network:
    external: true
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: news_consumer_ingester
    logging:              # Docker keeps at most 3 x 10 MB per container, oldest deleted
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      - PYTHONPATH=src
      - VAULT_ADDR=http://vault-server:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_SECRET_PATH=secret/CREDENTIALS
    networks:
      - vault-network
      - services_network
    volumes:
      - ../logs:/app/logs
networks:
  vault-network:
    external: true
  services_network:
    external: true
[project]
name = "news-consumer-ingester"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "confluent-kafka>=2.3.0",
    "elasticsearch>=9.5.1",
    "httpx==0.27.1",
    "hvac>=2.1.0,<3.0.0",
    "pydantic>=2.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.9",
    "uvicorn[standard]>=0.18.3",
]

[dependency-groups]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true      # langgraph, langsmith and hvac ship no stubs
warn_unused_ignores = true

[tool.uv]
package = true

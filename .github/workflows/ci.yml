name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # mypy --strict on src/ and the full pytest suite, via the shared ci-workflows job.
  test:
    uses: yedlurisrinu/ci-workflows/.github/workflows/unit-tests.yml@main
    with:
      test-path: tests
      sync-args: --frozen
      run-mypy: true

  # Image for the upcoming AWS deployment (Terraform); only from main, only after tests pass.
  build:
    name: Build and push Docker image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/news-consumer-ingester
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
